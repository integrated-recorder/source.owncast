name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test exact release commit
        run: |
          go mod download
          go test ./...
      - name: Verify release tag and version
        id: release
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          [[ "$tag" == v* && "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${GITHUB_REF}^{commit}")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build Linux release assets
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build -trimpath \
              -ldflags="-s -w -X github.com/integrated-recorder/source.owncast/internal/owncast.version=${VERSION}" \
              -o "dist/integrated-recorder-adapter-owncast_linux_${arch}" \
              ./cmd/integrated-recorder-adapter-owncast
            chmod 0755 "dist/integrated-recorder-adapter-owncast_linux_${arch}"
          done
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/integrated-recorder-adapter-owncast_linux_* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes "Owncast source plugin release built from ${SOURCE_COMMIT}."
